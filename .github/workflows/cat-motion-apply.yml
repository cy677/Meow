name: Apply reviewed cat motion stage-one source
on:
  push:
    branches: [feature/cat-motion-stage1-20260922]
    paths: [.github/workflows/cat-motion-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/feature/cat-motion-stage1-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked source diff and remove transfer tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/cat-motion-stage1-20260922
          cat .github/motion-stage1-transfer/{0,1,2,3,4} > "$RUNNER_TEMP/motion.patch.xz"
          echo "8a9ad34fdadf505d6d8300a9dd76dcee7625ca5a76eee6be7c2030933bc2874b  $RUNNER_TEMP/motion.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/motion.patch.xz" > "$RUNNER_TEMP/motion.patch"
          echo "14d26df6ba2deba2a1a5c14ad099a886446aea27f16b870de6bebac94544a2ed  $RUNNER_TEMP/motion.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/motion.patch"
          git apply --index "$RUNNER_TEMP/motion.patch"
          git rm -r .github/motion-stage1-transfer .github/workflows/cat-motion-apply.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: unify cat motion runtime and add six skeletal actions'
          git push origin HEAD:refs/heads/feature/cat-motion-stage1-20260922
          mkdir -p pet/test-results
          git rev-parse HEAD | tee pet/test-results/motion-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit tests and original source rig acceptance
        run: |
          npm run test:pet
          npm run test:motion
      - name: Both production builds
        run: npm run pet:build && npm run build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cat-motion-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          ln -s "$RUNNER_TEMP/cat-motion-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/cat-motion-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Cat motion production WebGL regression
        run: npm run test:cat-motion:browser
      - name: Existing model rewards regression
        if: ${{ !cancelled() }}
        run: node pet/tests/browser-models.mjs
      - name: Existing growth regression
        if: ${{ !cancelled() }}
        run: node pet/tests/browser-growth.mjs
      - name: Existing creation regression
        if: ${{ !cancelled() }}
        run: node pet/tests/browser-creation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-motion-stage1-review
          path: pet/test-results/
          retention-days: 7
