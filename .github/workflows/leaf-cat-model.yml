name: Leaf cat model
on:
  push:
    branches: [feature/leaf-cat-model-20260924]
  pull_request:
    paths:
      - 'src/models/leafCat/**'
      - 'src/catBuilder.js'
      - 'src/main.js'
      - 'src/mesh2motionSkinRig.js'
      - 'src/softPoke.js'
      - 'pet/**'
      - 'scripts/leaf-cat-review.mjs'
      - '.github/workflows/leaf-cat-model.yml'
permissions:
  contents: read
concurrency:
  group: leaf-cat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Model and regression tests
        run: |
          mkdir -p test-results/leaf-cat
          npm run test:pet 2>&1 | tee test-results/leaf-cat/unit-tests.txt
          node scripts/test_soft_poke.mjs
          npm run pet:build
          npm run build
      - name: Built preview and native editor browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/leaf-cat-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-cat-review
          path: test-results/leaf-cat
          retention-days: 14
