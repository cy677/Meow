name: Apply verified growth implementation
on:
  push:
    branches: ['feature/points-pet-growth-20260918']
    paths: ['pet/.growth-transfer-*.b64', '.github/workflows/apply-growth-transfer.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'cy677/Meow' && github.ref == 'refs/heads/feature/points-pet-growth-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify base and reconstruct reviewed UTF-8 sources
        run: |
          git diff --exit-code e904199ad2efd389df0cb70342c1026c0ab4e3bf -- . ':!pet/.growth-transfer-*.b64' ':!.github/workflows/apply-growth-transfer.yml'
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          allowed = set('''.github/workflows/points-pet.yml README.en.md README.ja.md README.md pet/GROWTH_API.md pet/GROWTH_GUIDE.md pet/README.md pet/app.js pet/growth.css pet/growthCatalog.mjs pet/growthStore.mjs pet/growthUI.js pet/history.js pet/localLedger.mjs pet/server.mjs pet/store.mjs pet/tests/browser-creation.mjs pet/tests/browser-growth.mjs pet/tests/environment.test.mjs pet/tests/growth.test.mjs pet/tests/local-presets.test.mjs pet/tests/pet.test.mjs pet/tests/tablet.test.mjs pet/tests/upstream.test.mjs'''.split())
          parts = sorted(Path('pet').glob('.growth-transfer-*.b64'))
          assert len(parts) == 4
          raw = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '3cc5db59bba863fbf519fde64c0fa10f3465785458dad0e37cc61bfe24265861'
          entries = json.loads(lzma.decompress(raw))
          assert len(entries) == 24 and {e['path'] for e in entries} == allowed
          prepared = {}
          for e in entries:
              p = Path(e['path'])
              assert not p.is_symlink()
              if 'content' in e:
                  assert not p.exists(), str(p)
                  text = e['content']
              else:
                  text = p.read_text(encoding='utf-8')
                  assert hashlib.sha256(text.encode()).hexdigest() == e['oldSha256'], str(p)
                  for start, end, replacement in e['edits']:
                      assert 0 <= start <= end <= len(text)
                      text = text[:start] + replacement + text[end:]
                  assert hashlib.sha256(text.encode()).hexdigest() == e['newSha256'], str(p)
              prepared[str(p)] = text
          for name, text in prepared.items():
              Path(name).parent.mkdir(parents=True, exist_ok=True)
              Path(name).write_text(text, encoding='utf-8')
          Path('/tmp/growth-paths.json').write_text(json.dumps(sorted(allowed)))
          for p in parts: p.unlink()
          Path('.github/workflows/apply-growth-transfer.yml').unlink()
          print('Verified all 24 source files; temporary transfer files removed.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Domain and HTTP regressions
        run: |
          set -o pipefail
          mkdir -p pet/test-results
          npm run test:pet 2>&1 | tee pet/test-results/growth-domain.txt
      - name: Both application builds
        run: |
          set -o pipefail
          npm run pet:build 2>&1 | tee pet/test-results/growth-build.txt
          npm run build 2>&1 | tee pet/test-results/original-build.txt
      - name: Store verified source tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request, zipfile
          from pathlib import Path
          paths = json.loads(Path('/tmp/growth-paths.json').read_text())
          def post(endpoint, data):
              req = urllib.request.Request('https://api.github.com/repos/cy677/Meow/git/' + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          entries = []
          hashes = {}
          for name in paths:
              raw = Path(name).read_bytes()
              blob = post('blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              hashes[name] = hashlib.sha256(raw).hexdigest()
          tree = post('trees', {'base_tree': '4c9f1be9afd47e0d8b9539b42cf1df6ac06b22c3', 'tree': entries})
          result = {'tree_sha': tree['sha'], 'parent_sha': os.environ['GITHUB_SHA'], 'branch': 'feature/points-pet-growth-20260918', 'sha256': hashes, 'node': subprocess.check_output(['node', '-v']).decode().strip()}
          Path('pet/test-results/growth-transfer-result.json').write_text(json.dumps(result, indent=2))
          print('Verified source tree:', tree['sha'])
          subprocess.run(['git', 'add', '--', '.', ':!pet/test-results'], check=True)
          local_tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert local_tree == tree['sha'], (local_tree, tree['sha'])
          subprocess.run(['git', 'archive', '--format=zip', local_tree, '-o', '/tmp/meow-growth-source.zip'], check=True)
          PY
      - name: Install browser runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Growth UI integration
        id: growth
        continue-on-error: true
        run: node pet/tests/browser-growth.mjs
      - name: Original home and parent creation regression
        id: creation
        continue-on-error: true
        run: node pet/tests/browser-creation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-growth-evidence
          path: pet/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-growth-source
          path: /tmp/meow-growth-source.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Require browser checks
        if: steps.growth.outcome == 'failure' || steps.creation.outcome == 'failure'
        run: exit 1
