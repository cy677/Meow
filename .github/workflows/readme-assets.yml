name: Prepare README screenshots
on:
  push:
    branches: ['docs/readme-assets-20260918']
    paths: ['.github/workflows/readme-assets.yml']
permissions:
  contents: write
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: meow-growth-evidence
          run-id: 35312056885
          github-token: ${{ github.token }}
          path: /tmp/meow-readme-evidence
      - name: Install lossless screenshot processor
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Prepare verified image blobs without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          from PIL import Image
          root = Path('/tmp/meow-readme-evidence')
          for name in ['growth-browser-report.json', 'creation-browser-report.json']:
              assert json.loads((root / name).read_text())['ok'] is True, name
          specs = [
              ('home.png', 'luna-creation-child.png', None, 'aefe2f2525bd02c222442d17c5e769ae5cea132a4db47763d5b3d2df68bd6e2d'),
              ('growth-garden.png', 'growth-child-garden.png', None, '8f4eef9fe30348d7c8e214696a096faab81e529308507e7b5fe572dd1028605f'),
              ('parent-scoring.png', 'growth-parent.png', [20,520,550,1590], '96a399dfbc52f48303ac19183defd71638480d772df76e7960e6a4db2121ca99'),
              ('task-library.png', 'growth-targets.png', [55,852,1125,1667], '3eaba6315a3f860225463cc7f17866e3e0993c9a4d2116c0eea9d3ec51fa31ac'),
              ('parent-studio.png', 'luna-creation-parent.png', None, '288d6d0dcb2b4cf4571aa456720c0ed94ddd8ecc5cb25ec588d91c6e503589db'),
              ('family-records.png', 'growth-family-distribution.png', [18,520,1165,955], 'f46da0dc64487af794b7db4352aaa18260dc57a954d5887e37011be76c2b4933'),
          ]
          destination = Path('/tmp/meow-readme-images')
          destination.mkdir()
          def blob(raw):
              request = urllib.request.Request('https://api.github.com/repos/cy677/Meow/git/blobs', data=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)['sha']
          rows = []
          for name, source, crop, expected in specs:
              raw = (root/source).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == expected, source
              image = Image.open(root/source).convert('RGB')
              if crop:
                  assert 0 <= crop[0] < crop[2] <= image.width and 0 <= crop[1] < crop[3] <= image.height
                  image = image.crop(crop)
              output = destination/name
              image.save(output, optimize=True)
              data = output.read_bytes()
              row = {'path': 'docs/readme/'+name, 'source': source, 'crop': crop, 'source_sha256': expected, 'size': list(image.size), 'sha256': hashlib.sha256(data).hexdigest(), 'blob_sha': blob(data)}
              rows.append(row)
              print('IMAGE_BLOB ' + json.dumps(row, ensure_ascii=False), flush=True)
          manifest = {'source_commit': 'f06c8def41f5958ffd8281aced4ec48722a99fb1', 'source_run': 35312056885, 'source_artifact': 10533756177, 'description': 'Actual Chromium regression screenshots using temporary demonstration accounts, not family records. Cropped images retain original pixels; no generated interface or edited values.', 'images': rows}
          (destination/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n')
          print('README_IMAGES_READY', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: readme-images
          path: /tmp/meow-readme-images/
          retention-days: 7
