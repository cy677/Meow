name: Cat motion stage one main port
on:
  push:
    branches: [feature/cat-motion-stage1-main-20260922]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cat-motion-stage1-main-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/cat-motion-stage1-main-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify main preservation and complete Stage1 transplant
        run: node scripts/verify_cat_motion_port.mjs 345388baf405907199c815043ffbbbfd367a0ac0 b4252960467a49061b88f0493e3538c8ec1377c9
      - run: npm ci --ignore-scripts
      - name: Unit tests and original source rig acceptance
        run: |
          npm run test:pet
          npm run test:motion
      - name: Both production builds
        run: npm run pet:build && npm run build
      - name: Install isolated browser test tooling
        id: browser
        run: |
          npm install --prefix "$RUNNER_TEMP/cat-motion-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          ln -s "$RUNNER_TEMP/cat-motion-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/cat-motion-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Cat motion production WebGL regression
        run: npm run test:cat-motion:browser
      - name: Existing model rewards regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node pet/tests/browser-models.mjs
      - name: Existing growth regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node pet/tests/browser-growth.mjs
      - name: Existing creation regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node pet/tests/browser-creation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-motion-stage1-main-review
          path: pet/test-results/
          retention-days: 7
