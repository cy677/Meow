name: Kenney reward verification
on:
  push:
    branches: [feature/kenney-rewards-20260922]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kenney-rewards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply reviewed view framing and browser synchronization corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pet/models/modelLayer.js');text=p.read_text()
          if 'function fitView()' not in text:
              text=text.replace('    }));\n    return pending;', '    })).then(()=>{if(!disposed&&token===generation)fitView();});\n    return pending;')
              fit='''  // Fit only after equipment changes or explicit view reset, never on each frame/poll.
            // Preserve the viewing direction and target; ordinary orbit/zoom remains available.
            function fitView() {
              if(disposed||!entries.size)return;
              const bounds=new THREE.Box3();
              for(const items of entries.values())for(const entry of items)bounds.expandByObject(entry.asset.root);
              const cat=getCat();if(cat)bounds.expandByObject(cat);
              if(bounds.isEmpty())return;
              bounds.expandByScalar(.16);camera.updateMatrixWorld(true);
              const backward=camera.position.clone().sub(controls.target).normalize();
              const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
              const up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
              const tanV=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
              const tanH=tanV*camera.aspect;
              let distance=camera.position.distanceTo(controls.target);
              for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]) {
                const relative=new THREE.Vector3(x,y,z).sub(controls.target),depth=relative.dot(backward);
                distance=Math.max(distance,depth+Math.abs(relative.dot(right))/(tanH*.84),depth+Math.abs(relative.dot(up))/(tanV*.72));
              }
              distance=Math.min(controls.maxDistance,distance);
              camera.position.copy(controls.target).addScaledVector(backward,distance);
              controls.update();camera.updateMatrixWorld(true);
            }
          '''
              text=text.replace('  function projected(e) {',fit+'  function projected(e) {').replace('return {select,update,diagnostics()', 'return {select,update,fitView,diagnostics()')
              p.write_text(text)
          p=Path('pet/studioRuntime.txt');text=p.read_text().replace('controls.update();controls.enableDamping=damping;', 'controls.update();controls.enableDamping=damping;petModelLayer?.fitView();')
          p.write_text(text)
          p=Path('pet/tests/browser-models.mjs');text=p.read_text()
          text=text.replace("await page.waitForFunction(()=>!document.querySelector('[data-reward-id=kenney-chick] button[data-busy]'));", "await page.locator('#rewards-dialog').waitFor({state:'hidden'});")
          text=text.replace("if(await page.locator('#rewards-dialog').isVisible())await page.locator('[data-action=close-rewards]').click();", "await page.locator('#rewards-dialog').waitFor({state:'hidden'});")
          p.write_text(text)
          # Current main intentionally removed help/source text from the compact scoring panel.
          # Keep the condition check and the separate full-guide checks instead of obsolete labels.
          p=Path('pet/tests/browser-growth.mjs');text=p.read_text()
          text=text.replace("assert.match(await parent.locator('#growth-basis').innerText(),/允许的帮助/);assert.match(await parent.locator('#growth-basis').innerText(),/指南/);", "assert.equal(await parent.locator('#growth-basis').isVisible(),true);")
          p.write_text(text)
          PY
      - run: npm ci --ignore-scripts
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/model-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          ln -s "$RUNNER_TEMP/model-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/model-browser/node_modules/.bin/playwright" install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Unit tests and both builds
        run: |
          npm run test:pet > /tmp/unit.log 2>&1 || { cat /tmp/unit.log; exit 1; }
          tail -10 /tmp/unit.log
          npm run pet:build > /tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
          tail -8 /tmp/build.log
          npm run build > /tmp/original-build.log 2>&1 || { cat /tmp/original-build.log; exit 1; }
          tail -8 /tmp/original-build.log
      - name: Commit reviewed corrections on feature branch
        if: github.ref == 'refs/heads/feature/kenney-rewards-20260922'
        run: |
          git add pet/models/modelLayer.js pet/studioRuntime.txt pet/tests/browser-models.mjs pet/tests/browser-growth.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='Meow model integration' -c user.email='actions@users.noreply.github.com' commit -m 'fix: frame equipped models and await completed reward transitions'
            git push origin HEAD:feature/kenney-rewards-20260922
          fi
      - name: Model browser regression
        run: node pet/tests/browser-models.mjs
      - name: Existing growth regression
        if: always()
        run: node pet/tests/browser-growth.mjs
      - name: Existing creation regression
        if: always()
        run: node pet/tests/browser-creation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kenney-model-review
          path: pet/test-results/
          retention-days: 7
