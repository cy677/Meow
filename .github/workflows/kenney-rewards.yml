name: Kenney reward verification
on:
  push:
    branches: [feature/kenney-rewards-20260922]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kenney-rewards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Import reviewed model subset
        run: python3 scripts/import_kenney_models.py
      - name: Commit assets on implementation branch only
        if: github.ref == 'refs/heads/feature/kenney-rewards-20260922'
        run: |
          git add public/models/kenney third_party/kenney
          if ! git diff --cached --quiet; then
            git -c user.name='Meow asset import' -c user.email='actions@users.noreply.github.com' commit -m 'assets: vendor 23 verified CC0 Kenney GLB models and licenses'
            git push origin HEAD:feature/kenney-rewards-20260922
          fi
      - run: npm ci --ignore-scripts
      - name: Prepare isolated validation workspace
        run: tar --exclude=.git --exclude=pet/data --exclude='*.pem' --exclude='*.key' -czf /tmp/meow-validation.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: meow-validation-workspace
          path: /tmp/meow-validation.tar.gz
          retention-days: 1
