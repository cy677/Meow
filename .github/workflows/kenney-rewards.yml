name: Kenney reward verification
on:
  push:
    branches: [feature/kenney-rewards-20260922]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kenney-rewards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Correct compact catalog thumbnail layout and asynchronous test wait
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pet/child.css')
          text=p.read_text()
          old='.model-reward-thumbnail { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }'
          new='.child-dialog .reward-art.art-model { height:74px; gap:8px; }\n.model-reward-thumbnail { display:block; flex:0 0 86px; width:86px; height:64px; object-fit:contain; border-radius:8px; }'
          if old in text: p.write_text(text.replace(old,new).replace('.model-reward-thumbnail ~ span:not(.reward-tag) { visibility:hidden; }','.model-reward-thumbnail ~ span:not(.reward-tag) { display:none; }'))
          p=Path('pet/app.js');p.write_text(p.read_text().replace("image.loading='lazy'", "image.loading='eager'"))
          p=Path('pet/tests/browser-models.mjs');text=p.read_text()
          old="await page.locator('.model-reward-thumbnail').first().waitFor();assert.equal(await page.locator('.model-reward-thumbnail').first().evaluate(img=>img.complete&&img.naturalWidth>0),true);"
          new="await page.waitForFunction(()=>{const img=document.querySelector('.model-reward-thumbnail');return img?.complete&&img.naturalWidth>0;});"
          p.write_text(text.replace(old,new))
          PY
      - run: npm ci --ignore-scripts
      - name: Install isolated browser test dependency without changing project resolution
        run: |
          npm install --prefix "$RUNNER_TEMP/model-browser" --no-package-lock --ignore-scripts playwright@1.55.0
          ln -s "$RUNNER_TEMP/model-browser/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/model-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Unit tests and both application builds
        run: |
          npm run test:pet
          npm run pet:build
          npm run build
      - name: Commit reviewed UI corrections on feature branch
        if: github.ref == 'refs/heads/feature/kenney-rewards-20260922'
        run: |
          git add pet/child.css pet/app.js pet/tests/browser-models.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='Meow model integration' -c user.email='actions@users.noreply.github.com' commit -m 'fix: display model thumbnails at usable size and await image decoding'
            git push origin HEAD:feature/kenney-rewards-20260922
          fi
      - name: Real Chromium touch, animation, physics and catalog checks
        run: node pet/tests/browser-models.mjs
      - name: Existing growth and creation regression
        if: always()
        run: |
          node pet/tests/browser-growth.mjs
          node pet/tests/browser-creation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kenney-model-review
          path: pet/test-results/
          retention-days: 7
