name: Growth system checks
on:
  push:
    branches: ['feature/points-pet-growth-*']
  pull_request:
    paths: ['pet/**', 'README*', '.github/workflows/growth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source snapshot
        run: git archive --format=zip HEAD -o /tmp/meow-growth-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: meow-growth-source
          path: /tmp/meow-growth-source.zip
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:pet
      - run: npm run pet:build && npm run build
      - name: Growth browser regression
        if: hashFiles('pet/tests/browser-growth.mjs') != ''
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          set -o pipefail
          mkdir -p pet/test-results
          node pet/tests/browser-growth.mjs 2>&1 | tee pet/test-results/browser-growth.txt
      - name: Native kitten and parent creation regression
        if: ${{ !cancelled() && hashFiles('pet/tests/browser-creation.mjs') != '' }}
        run: |
          set -o pipefail
          node pet/tests/browser-creation.mjs 2>&1 | tee pet/test-results/browser-creation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meow-growth-evidence
          path: pet/test-results/
          if-no-files-found: ignore
          retention-days: 7
