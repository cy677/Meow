name: Meow maintenance checks
on:
  pull_request:
    paths: ['pet/**', 'src/**', 'scripts/**', 'index.html', 'Meow', 'package*.json', 'pet-settings.example.json', 'vite*.js', '.github/workflows/**']
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meow-maintenance-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Domain and HTTP regression
        run: |
          mkdir -p pet/test-results
          npm run test:pet 2>&1 | tee pet/test-results/tests.txt
      - name: Both application builds
        run: npm run pet:build && npm run build
      - name: Current application smoke
        run: |
          npm install --prefix /tmp/meow-browser-tools --ignore-scripts playwright@1.55.0
          /tmp/meow-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          MEOW_PLAYWRIGHT=/tmp/meow-browser-tools/node_modules/playwright/index.mjs node pet/tests/browser-maintenance.mjs 2>&1 | tee pet/test-results/browser-maintenance.txt
      - name: Source snapshot
        if: always()
        run: |
          mkdir -p pet/test-results
          git archive --format=zip HEAD -o pet/test-results/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meow-maintenance-evidence
          path: pet/test-results/
          retention-days: 7
