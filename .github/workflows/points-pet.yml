name: Points pet checks
on:
  push:
    branches: ['main', 'feature/points-pet-*']
  pull_request:
    paths: ['pet/**', 'src/**', 'scripts/**', 'index.html', 'Meow', 'package*.json', 'vite*.js', '.github/workflows/points-pet.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pet-checks-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reproducible offline build dependencies
        run: tar -czf /tmp/meow-node-tools.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: meow-node-tools
          path: /tmp/meow-node-tools.tgz
          retention-days: 3
      - name: Domain and HTTP tests
        run: |
          mkdir -p pet/test-results
          npm run test:pet 2>&1 | tee pet/test-results/tests.txt
      - name: Build pet and original editor
        run: npm run pet:build && npm run build
      - name: Focused browser smoke (login, reward, growth, creation and photo)
        if: hashFiles('pet/tests/browser-maintenance.mjs') != ''
        run: |
          npm install --prefix /tmp/meow-browser-tools --ignore-scripts playwright@1.55.0
          /tmp/meow-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          MEOW_PLAYWRIGHT=/tmp/meow-browser-tools/node_modules/playwright/index.mjs node pet/tests/browser-maintenance.mjs 2>&1 | tee pet/test-results/browser-maintenance.txt
      - name: Source snapshot
        if: always()
        run: |
          mkdir -p pet/test-results
          git archive --format=zip HEAD -o pet/test-results/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: points-pet-evidence
          path: pet/test-results/
          retention-days: 7
