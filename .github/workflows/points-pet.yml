name: Points pet checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:pet
      - run: npm run pet:build && npm run build
      - run: |
          npm install --prefix /tmp/meow-browser-tools --ignore-scripts playwright@1.55.0
          /tmp/meow-browser-tools/node_modules/.bin/playwright install --with-deps chromium
          MEOW_PLAYWRIGHT=/tmp/meow-browser-tools/node_modules/playwright/index.mjs node pet/tests/browser-maintenance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: points-pet-evidence
          path: pet/test-results/
          retention-days: 7
